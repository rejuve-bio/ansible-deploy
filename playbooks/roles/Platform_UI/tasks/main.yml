---
- name: Check prerequisites
  command: "python3 {{ playbook_dir }}/prerequisite_check_local.py"
  register: prerequisites_check
  failed_when: prerequisites_check.rc != 0
  changed_when: false
  become: no

- name: Set platform-ui directory
  set_fact:
    platform_ui_dir: "{{ local_base_dir }}/platform-ui"

- name: Ensure platform-ui directory exists
  file:
    path: "{{ platform_ui_dir }}"
    state: directory
    mode: '0755'
  become: no

- name: Copy .env file
  template:
    src: "templates/UI.env"
    dest: "{{ platform_ui_dir }}/.env"
    mode: '0644'
  become: no

- name: Ensure shared local docker network exists
  community.docker.docker_network:
    name: "{{ local_docker_network }}"
    state: present
    ipam_config:
      - subnet: 10.99.0.0/24

- name: Pull platform-ui Docker image
  community.docker.docker_image:
    name: "{{ platform_ui_image }}"
    source: pull
    force_source: yes

- name: Run platform-ui container
  community.docker.docker_container:
    name: platform-ui-local
    image: "{{ platform_ui_image }}"
    state: started
    restart_policy: unless-stopped
    env_file: "{{ platform_ui_dir }}/.env"
    ports:
      - "127.0.0.1:{{ platform_ui_port }}:3000"
    networks:
      - name: "{{ local_docker_network }}"

- name: Display deployment info
  debug:
    msg:
      - "Platform UI deployed successfully!"
      - "Access at: http://localhost:{{ platform_ui_port }}"
      - "Container name: platform-ui-local"
