version: '3.8'

services:
  annotation_service:
    image: "${DOCKER_HUB_REPO}"
    container_name: annotation-service-local
    volumes:
      - ${MORK_DATA_ROOT:-/mnt/hdd_1}:${MORK_DATA_ROOT:-/mnt/hdd_1}:rw
      - /dev/shm:/dev/shm
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared with the celery workers - they write graph results here.
      - annotation_public:/app/public
    ports:
      - "127.0.0.1:${APP_PORT}:${APP_PORT}"
    command: gunicorn app.main:socket_app --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:${APP_PORT}
    restart: always
    depends_on:
      - mongodb
      - redis
    env_file:
      - .env
    environment: &app_env
      MONGO_URI: ${MONGO_URI}
      APP_PORT: ${APP_PORT}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://annotation-redis-local:6379/0
      REDIS_URL_BROKER: redis://annotation-redis-local:6379/1
      REDIS_EXPIRATION: 3600
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      FASTAPI_APP: "true"
      MORK_DATA_DIR: ${MORK_DATA_DIR:-/mnt/hdd_1/biocypher-kg/output/hsa/metta_out_v6}
      FLY_MORK_DATA_DIR: ${FLY_MORK_DATA_DIR:-/mnt/hdd_1/biocypher-kg/output/dmel/metta}
      COMPOSE_PROJECT_NAME: annotation-query-backend-local
      DEDUP_ENABLED: ${DEDUP_ENABLED:-true}

  celery_worker_fast:
    image: "${DOCKER_HUB_REPO}"
    container_name: celery-worker-fast-local
    volumes:
      - ${MORK_DATA_ROOT:-/mnt/hdd_1}:${MORK_DATA_ROOT:-/mnt/hdd_1}:rw
      - /dev/shm:/dev/shm
      - /var/run/docker.sock:/var/run/docker.sock
      - annotation_public:/app/public
    command: celery -A app.workers.celery_app worker -Q fast --loglevel=info --concurrency 16 --max-tasks-per-child 50
    restart: always
    depends_on:
      - annotation_service
      - redis
      - mongodb
    env_file:
      - .env
    environment:
      <<: *app_env
      C_FORCE_ROOT: "1"

  celery_worker_slow:
    image: "${DOCKER_HUB_REPO}"
    container_name: celery-worker-slow-local
    volumes:
      - ${MORK_DATA_ROOT:-/mnt/hdd_1}:${MORK_DATA_ROOT:-/mnt/hdd_1}:rw
      - /dev/shm:/dev/shm
      - /var/run/docker.sock:/var/run/docker.sock
      - annotation_public:/app/public
    command: celery -A app.workers.celery_app worker -Q slow --loglevel=info --concurrency 16 --max-tasks-per-child 50
    restart: always
    depends_on:
      - annotation_service
      - redis
      - mongodb
    env_file:
      - .env
    environment:
      <<: *app_env
      C_FORCE_ROOT: "1"

  mongodb:
    image: mongo:7.0
    container_name: annotation-mongodb-local
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:${MONGODB_DOCKER_PORT}:27017"
    restart: always

  redis:
    image: redis:latest
    container_name: annotation-redis-local
    ports:
      - "127.0.0.1:${REDIS_DOCKER_PORT}:6379"
    restart: always
    volumes:
      - redis_data:/data

  caddy:
    image: caddy:latest
    container_name: annotation-caddy-local
    ports:
      - "127.0.0.1:${CADDY_PORT}:${CADDY_PORT_FORWARD}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    command: caddy reverse-proxy --from http://0.0.0.0:${CADDY_PORT} --to http://annotation_service:${APP_PORT}
    restart: always
    depends_on:
      - annotation_service

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: annotation-meilisearch-local
    ports:
      - "127.0.0.1:${MEILI_PORT}:7700"
    volumes:
      - meilisearch_data:/meili_data
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-your_master_key_here}
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_DB_PATH: /meili_data
      MEILI_HTTP_ADDR: 0.0.0.0:7700
    restart: always

volumes:
  mongo_data:
  redis_data:
  caddy_data:
  caddy_config:
  meilisearch_data:
  annotation_public:

networks:
  default:
    name: rejuve-services-net
    external: true
